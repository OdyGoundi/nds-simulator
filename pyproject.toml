# Build + project metadata for dynaSim (nds-simulator).
#
# Runtime entry point is the Streamlit script:
#     streamlit run app/nlds_app.py
#
# Streamlit Cloud reads requirements.txt (which `-r app/requirements.txt`s
# the canonical pinned list). The `[project.dependencies]` table below
# mirrors that same list so `pip install .` works in any environment.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynasim"
version = "1.0.0"
description = "Streamlit app for simulating and analyzing non-linear dynamical systems — phase portraits, time series, Lyapunov exponents, Poincare sections, and parametric sweeps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Odysseas Gkountinakos", email = "ody.gkount@gmail.com" },
]
keywords = [
    "nonlinear-dynamics",
    "dynamical-systems",
    "chaos",
    "lyapunov-exponents",
    "poincare-section",
    "bifurcation-diagram",
    "streamlit",
    "scientific-computing",
    "simulation",
    "numba",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Mirrors app/requirements.txt — keep both in sync. Lower bounds match
# what is actually exercised by the cache / Numba layers; the rest are
# unbounded so resolvers can pick the latest compatible release.
dependencies = [
    "streamlit>=1.37.0",
    "numpy>=1.21",
    "scipy",
    "matplotlib",
    "pandas",
    "sympy",
    "numba",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.urls]
Homepage      = "https://nlds-simulator.streamlit.app/"
Repository    = "https://github.com/OdyGoundi/nds-simulator"
Issues        = "https://github.com/OdyGoundi/nds-simulator/issues"
Documentation = "https://github.com/OdyGoundi/nds-simulator/tree/main/docs"

# ---------------------------------------------------------------------------
# Packaging
# ---------------------------------------------------------------------------
# `app/` and `core/` are PEP 420 namespace packages (no top-level
# __init__.py); their subpackages carry the actual modules. We let
# setuptools auto-discover both trees and explicitly exclude paths that
# are not part of the runtime (legacy prototypes, tests, docs, build
# scratch).

[tool.setuptools.packages.find]
where     = ["."]
include   = ["app*", "core*"]
exclude   = [
    "legacy*",
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "*.__pycache__*",
]
namespaces = true

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length    = 100
target-version = "py310"
extend-exclude = [
    "legacy",
    "docs/thesis",
    "tests/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length: ruff format already enforces it
    "B008",  # function-call-in-default-arg: dataclass field defaults are idiomatic here
]

[tool.ruff.lint.per-file-ignores]
# nlds_app.py mutates sys.path before the app imports — keep that pattern.
"app/nlds_app.py" = ["E402"]

[tool.pytest.ini_options]
minversion  = "7.0"
testpaths   = ["tests"]
python_files = ["test_*.py"]
addopts     = "-ra -q --strict-markers"

[tool.mypy]
python_version         = "3.10"
warn_unused_configs    = true
warn_return_any        = false
ignore_missing_imports = true
namespace_packages     = true
explicit_package_bases = true
exclude                = "(^legacy/|^docs/|^tests/.*\\.ipynb$)"
